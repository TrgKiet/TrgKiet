<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Route 01 – Editorial Minimal Palette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:#111216; --paper:#F8F7F4; --parchment:#EAE7E0; --cobalt:#0A84FF; --vermilion:#E14B2E;
    }
    * { box-sizing: border-box; }
    body { margin:0; background: var(--paper); color: var(--ink); font: 16px/1.6 Inter, system-ui, sans-serif; }
    header { padding: 28px 24px 8px; }
    h1 { font-family: "Source Serif 4", serif; font-size: 40px; margin: 0 0 6px; }
    p { margin: 0 0 12px; color: #555; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; padding: 16px 24px 32px; }
    .swatch { border-radius: 12px; border: 1px solid #00000010; overflow: hidden; }
    .chip { height: 92px; }
    .meta { padding: 10px 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 12px; padding: 4px 8px; border-radius: 999px; border: 1px solid #00000014; background: #fff; }
    .demo { padding: 24px; background: #fff; border-top: 1px solid #00000010; }
    .btn { display: inline-block; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--ink); color: var(--paper); background: var(--cobalt); text-decoration: none; }
    .btn.secondary { background: transparent; color: var(--ink); border-color: #00000033; }
    .card { background: var(--parchment); border: 1px solid #00000010; border-radius: 14px; padding: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Route 01 – Editorial Minimal</h1>
    <p>Ink on paper with cobalt and vermilion accents. Serif display + sans UI.</p>
  </header>
  <main class="grid">
    <div class="swatch">
      <div class="chip" style="background: var(--ink)"></div>
      <div class="meta"><span>Ink</span><code>#111216</code></div>
      <div class="demo" style="background:#fff">
        <a class="btn secondary" href="#">Outline button</a>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: var(--paper)"></div>
      <div class="meta"><span>Paper</span><code>#F8F7F4</code></div>
      <div class="demo"><div class="card">Card on paper</div></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: var(--parchment)"></div>
      <div class="meta"><span>Parchment</span><code>#EAE7E0</code></div>
      <div class="demo"><div class="card">Muted section</div></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: var(--cobalt)"></div>
      <div class="meta"><span>Cobalt</span><code>#0A84FF</code></div>
      <div class="demo" style="background:#fff"><a class="btn" href="#">Primary CTA</a></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: var(--vermilion)"></div>
      <div class="meta"><span>Vermilion</span><code>#E14B2E</code></div>
      <div class="demo" style="background:#fff"><span class="badge" style="border-color:#E14B2E">Badge</span></div>
    </div>
  </main>
</body>
</html>
