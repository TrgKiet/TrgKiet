<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Route 02 – Neo‑Brutalist Palette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0F1115; --canvas:#F5F5F0; --lime:#00F6A2; --magenta:#FF3B81; --electric:#5B8CFF; }
    * { box-sizing: border-box; }
    body { margin:0; background: var(--canvas); color: var(--ink); font: 16px/1.6 "Bricolage Grotesque", system-ui, sans-serif; }
    header { padding: 24px; border-bottom: 3px solid var(--ink); }
    h1 { font-size: 36px; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; padding: 16px 24px 32px; }
    .swatch { border-radius: 10px; border: 3px solid var(--ink); overflow: hidden; background: #fff; }
    .chip { height: 92px; }
    .meta { padding: 10px 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; border-top: 3px solid var(--ink); }
    .btn { display: inline-block; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 8px; text-decoration: none; color: var(--ink); background: var(--lime); }
    .btn.alt { background: var(--magenta); color: #fff; }
    .btn.ghost { background: #fff; }
    .demo { padding: 14px; border-top: 3px solid var(--ink); }
    .badge { font: 12px/1.2 "JetBrains Mono", monospace; border: 2px solid var(--ink); padding: 4px 6px; border-radius: 6px; background: var(--electric); color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Route 02 – Neo‑Brutalist</h1>
  </header>
  <main class="grid">
    <div class="swatch">
      <div class="chip" style="background:var(--ink)"></div>
      <div class="meta"><span>Ink</span><code>#0F1115</code></div>
      <div class="demo"><a class="btn ghost" href="#">Ghost</a></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:var(--canvas)"></div>
      <div class="meta"><span>Canvas</span><code>#F5F5F0</code></div>
      <div class="demo"><span class="badge">TAG</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:var(--lime)"></div>
      <div class="meta"><span>Lime</span><code>#00F6A2</code></div>
      <div class="demo"><a class="btn" href="#">Primary</a></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:var(--magenta)"></div>
      <div class="meta"><span>Magenta</span><code>#FF3B81</code></div>
      <div class="demo"><a class="btn alt" href="#">Alt</a></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:var(--electric)"></div>
      <div class="meta"><span>Electric Blue</span><code>#5B8CFF</code></div>
      <div class="demo"><span class="badge" style="background:var(--lime); color: var(--ink)">FOCUS</span></div>
    </div>
  </main>
</body>
</html>
